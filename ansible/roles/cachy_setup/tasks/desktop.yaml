- name: Install Hyperpaper
  become: true
  community.general.pacman:
    state: present
    name:
      - "hyprpaper"

- name: Create Wallpaper Dir
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/Pictures/Wallpapers"
    state: directory
    recurse: true
    mode: u=rwx,g=rwx,o=rx

- name: Copy Wallpapers to Pictures Dir
  ansible.builtin.copy:
    src: night-cloud.jpg
    dest: "{{ ansible_facts.user_dir }}/Pictures/Wallpapers"
    mode: u=rw,g=rw,o=r

- name: Hyperpaper Config
  ansible.builtin.template:
    dest: "{{ ansible_facts.user_dir }}/.config/hypr/hyprpaper.conf"
    src: hyprpaper.conf.jinja
    mode: u=rw,g=rw,o=r

- name: Restart Hyprpaper Service
  ansible.builtin.systemd_service:
    state: restarted
    name: hyprpaper
    scope: user
  changed_when: false

