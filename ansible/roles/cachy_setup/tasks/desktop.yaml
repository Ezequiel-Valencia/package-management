######## Waybar ########
# https://github.com/Zilero232/arch-install-kit.git
- name: Install Waybar
  become: true
  community.general.pacman:
    name:
      - "waybar"
      - "swaync"
      - "cava"

- name: Make Themes Dir
  ansible.builtin.file:
    dest: "{{ ansible_facts.user_dir }}/.config/themes"
    mode: u=rwx,g=rwx,o=r
    state: directory

- name: Copy Over Base CSS
  ansible.builtin.copy:
    src: kanagawa.css
    dest: "{{ ansible_facts.user_dir }}/.config/themes/kanagawa.css"
    mode: u=rw,g=rw,o=r

- name: Copy Over Waybar Files
  ansible.builtin.copy:
    src: waybar
    dest: "{{ ansible_facts.user_dir }}/.config/waybar"
    mode: u=rw,g=rw,o=r

- name: Waybar Scripts Executable
  ansible.builtin.file:
    mode: u=rwx,g=rwx,o=r
    dest: "{{ item }}"
  with_fileglob:
    - "{{ ansible_facts.user_dir }}/.config/waybar/scripts/*"


- name: Stop Waybar Service
  ansible.builtin.systemd_service:
    name: waybar
    state: stopped
    scope: user
  changed_when: false

- name: Start Waybar Service
  ansible.builtin.systemd_service:
    name: waybar
    state: started
    scope: user
  changed_when: false

