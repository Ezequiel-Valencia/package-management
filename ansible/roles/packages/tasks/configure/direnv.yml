---
- name: Add direnv hook to {{ packages_shell_rc }}
  ansible.builtin.lineinfile:
    path: "{{ packages_shell_rc }}"
    line: 'eval "$(direnv hook {{ packages_shell }})"'
    create: true
    backup: true
    mode: "0644"
  when: packages_shell != 'fish'

- name: Add direnv hook to {{ packages_shell_rc }}
  ansible.builtin.lineinfile:
    path: "{{ packages_shell_rc }}"
    line: direnv hook fish | source
    create: true
    backup: true
    mode: "0644"
  when: packages_shell == 'fish'
