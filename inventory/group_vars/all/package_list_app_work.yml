  #     SNAP_CLASSIC: ghostty
  #     BREW: ghostty
  #     PACMAN: ghostty
  #   # So that when ssh into various nodes, the XTerm is known:
  #   #   if [[ "$TERM_PROGRAM" == "ghostty" ]]; then export TERM=xterm-256color; fi

