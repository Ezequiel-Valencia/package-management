- name: Setup Wifi
  community.general.nmcli:
    state: present
    type: wifi
    conn_name: riley347-hl
    ssid: riley347-hl
    ifname: wlan0
    dns4:
      - 10.0.0.6
      - 9.9.9.9
    wifi:
        hidden: true
        mode: infrastructure
    wifi_sec:
        proto:
            - rsn
        key-mgmt: wpa-psk
        psk: "{{ riley347_hl_pw }}"

- name: Bring Up Wifi
  community.general.nmcli:
    state: up
    conn_name: riley347-hl

- name: Template Wireguard Configuration
  become: true
  ansible.builtin.template:
    src: hl-wg.conf.jinja2
    dest: /etc/NetworkManager/system-connections/hl-wg.nmconnection
    mode: u=rw,o=,g=
  no_log: true

- name: Load WG Connection
  become: true
  ansible.builtin.command: >
    nmcli connection load /etc/NetworkManager/system-connections/hl-wg.nmconnection
  changed_when: false
